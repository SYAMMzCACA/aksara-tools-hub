<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKSARA TOOLS HUB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#09070f;color:#eee;font-family:system-ui,Arial,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}
#intro{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}#introVideo{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(#0002,#000b)}
#start{position:absolute;z-index:4;padding:14px 26px;border:1px solid #c77dff;border-radius:14px;background:#140a1dcc;color:white;cursor:pointer;box-shadow:0 0 30px #9b4dff55}
#title{position:absolute;z-index:4;text-align:center;opacity:0;transform:scale(.8);transition:1s;font-size:clamp(30px,8vw,80px);font-weight:900;letter-spacing:.08em;text-shadow:0 0 25px #c77dff}.sub{display:block;font-size:.22em;letter-spacing:.3em;margin-top:10px}
.panel{position:absolute;top:0;bottom:0;width:50%;background:#0a0710;z-index:3;transition:transform 1s cubic-bezier(.8,0,.2,1)}.left{left:0}.right{right:0}.open .left{transform:translateX(-100%)}.open .right{transform:translateX(100%)}
#app{min-height:100vh;display:flex}.side{width:245px;position:fixed;inset:0 auto 0 0;background:#0e0a16;border-right:1px solid #241631;padding:20px 14px;z-index:10}.brand{font-size:19px;font-weight:900;padding:10px 12px 24px}.brand span{color:#c77dff}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#aaa;padding:13px 14px;border-radius:11px;cursor:pointer;margin:4px 0}.nav button:hover,.nav button.active{background:#1d1228;color:#fff}
.main{margin-left:245px;width:calc(100% - 245px);padding:30px;max-width:1500px}.hero{padding:28px;border:1px solid #281936;border-radius:22px;background:linear-gradient(135deg,#130b1b,#0b0910);margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,52px)}.muted{color:#9c91a8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{border:1px solid #2b1a39;background:#100c17;border-radius:18px;padding:20px}.icon{font-size:30px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#7d35b8;color:#fff;font-weight:700}.alt{background:#21152b}.danger{background:#8d243c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.thumb{height:150px;border-radius:12px;background:#1a1220;display:flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.price{color:#d49cff;font-weight:800}.empty{padding:35px;text-align:center;border:1px dashed #382446;border-radius:18px;color:#93879d}form{display:grid;gap:12px;max-width:720px}label{font-size:13px;color:#b9aec3}input,textarea,select{width:100%;padding:12px;border:1px solid #33223e;border-radius:10px;background:#0b0910;color:#fff}textarea{min-height:100px}.commentBox{margin-top:16px;border-top:1px solid #291a35;padding-top:14px}.comment{padding:10px 0;border-bottom:1px solid #201529}.comment b{color:#d8a9ff}.small{font-size:12px;color:#82768c}
@media(max-width:760px){.side{width:72px;padding:14px 7px}.brand{font-size:0;text-align:center}.brand span{font-size:19px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}}
</style>
</head>
<body>
<div id="intro">
<video id="video" playsinline preload="auto"><source src="https://videotourl.com/videos/1788800862687-e0b821de-f2cc-4315-ae24-045e167324fe.mp4" type="video/mp4"></video>
<div class="shade"></div><button id="start">▶ PLAY INTRO</button>
<div id="title">AKSARA TOOLS HUB<span class="sub">COMMUNITY • TOOLS • ASSETS</span></div><div class="panel left"></div><div class="panel right"></div>
</div>
<div id="app" class="hidden"><aside class="side"><div class="brand">AKSARA <span>TOOLS HUB</span></div><nav class="nav">
<button data-p="home">🏠 Beranda</button><button data-p="tools">🛠️ Tools</button><button data-p="store">🛍️ Aksara Store</button><button data-p="free">🆓 Free Assets</button><button data-p="paid">💎 Paid Assets</button><button data-p="support">💬 Support</button><button data-p="settings">⚙️ Setting</button><button data-p="admin">🔐 Admin Panel</button>
</nav></aside><main class="main" id="content"></main></div>
<script>
const SUPABASE_URL="https://eiuzozldgldzfssufusq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_GjOkc_lGJZep0RH7nmt7Og_6lWKTCjG";
const DISCORD_TICKET_URL="https://discord.com/channels/1536301578561257554/1541828022351433748";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const pages={
home:`<section class="hero"><h1>AKSARA TOOLS HUB</h1><p class="muted">Tools, store, dan asset komunitas dalam satu tempat.</p></section><h2>Kategori</h2><div class="grid">
<div class="card"><div class="icon">🎧</div><h3>Audio Bypass Tools</h3><p class="muted">Koleksi tools audio komunitas.</p><button class="btn" onclick="go('tools')">Buka</button></div>
<div class="card"><div class="icon">🛍️</div><h3>Aksara Store</h3><p class="muted">Produk dan kebutuhan komunitas.</p><button class="btn" onclick="go('store')">Buka</button></div>
<div class="card"><div class="icon">🆓</div><h3>Free Assets</h3><p class="muted">Asset gratis dengan download langsung.</p><button class="btn" onclick="go('free')">Buka</button></div>
<div class="card"><div class="icon">💎</div><h3>Paid Assets</h3><p class="muted">Asset premium dengan sistem tiket.</p><button class="btn" onclick="go('paid')">Buka</button></div></div>`,
tools:`<section class="hero"><h1>Tools</h1><p class="muted">Tools AKSARA.</p></section><div id="tools" class="grid"></div>`,
store:`<section class="hero"><h1>Aksara Store</h1><p class="muted">Produk komunitas.</p></section><div id="store" class="grid"></div>`,
free:`<section class="hero"><h1>Free Assets</h1><p class="muted">Asset gratis.</p></section><div id="free" class="grid"></div>`,
paid:`<section class="hero"><h1>Paid Assets</h1><p class="muted">Asset premium.</p></section><div id="paid" class="grid"></div>`,
support:`<section class="hero"><h1>Support</h1><p class="muted">Hubungi Discord untuk bantuan.</p><button class="btn" onclick="window.open(DISCORD_TICKET_URL,'_blank')">💬 Buka Discord Ticket</button></section>`,
settings:`<section class="hero"><h1>Setting</h1><p class="muted">Pengaturan website.</p><button class="btn alt" onclick="location.reload()">▶ Putar Intro Lagi</button></section>`,
admin:`<section class="hero"><h1>Admin Panel</h1><p class="muted">Tambah produk ke Supabase.</p></section><form id="form">
<label>Nama Produk<input name="name" required></label><label>Kategori<select name="category"><option value="free">Free</option><option value="paid">Paid</option><option value="tools">Tools</option><option value="store">Aksara Store</option></select></label>
<label>Harga<input name="price" type="number" min="0" value="0"></label><label>Thumbnail URL<input name="thumbnail_url"></label><label>Download URL / File Link<input name="download_url"></label><label>Link Tiket Discord<input name="ticket_url" value="${DISCORD_TICKET_URL}"></label><label>Deskripsi<textarea name="description"></textarea></label><button class="btn" type="submit">➕ Tambah Produk</button></form><p id="msg" class="muted"></p><div id="adminProducts" class="grid"></div>`
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function products(){const r=await sb.from('products').select('*').order('created_at',{ascending:false});return r.error?[]:r.data||[]}
function card(p){let a=p.category==='paid'?`<button class="btn" onclick="window.open('${esc(p.ticket_url||DISCORD_TICKET_URL)}','_blank')">🎟️ TIKET BAYAR</button>`:`<button class="btn" onclick="window.open('${esc(p.download_url||'#')}','_blank')">⬇ DOWNLOAD</button>`;return `<article class="card"><div class="thumb">${p.thumbnail_url?`<img src="${esc(p.thumbnail_url)}">`:'📦'}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'')}</p>${p.price?`<div class="price">Rp ${Number(p.price).toLocaleString('id-ID')}</div>`:''}<div class="actions">${a}<button class="btn alt" onclick="comments(${p.id})">💬 Komentar</button></div><div id="c${p.id}" class="commentBox"></div></article>`}
async function list(id,cat){let el=document.getElementById(id);if(!el)return;el.innerHTML='<div class="empty">Memuat...</div>';let ps=await products();ps=ps.filter(p=>p.category===cat);el.innerHTML=ps.length?ps.map(card).join(''):'<div class="empty">Belum ada produk.</div>'}
async function comments(id){let b=document.getElementById('c'+id);let r=await sb.from('comments').select('*').eq('product_id',id).order('created_at');let d=r.data||[];b.innerHTML=`<form onsubmit="addComment(event,${id})"><label>Nama<input name="name" required maxlength="40"></label><label>Komentar<textarea name="comment" required maxlength="500"></textarea></label><button class="btn">Kirim Komentar</button></form>${d.map(c=>`<div class="comment"><b>${esc(c.name)}</b><div>${esc(c.comment)}</div></div>`).join('')||'<div class="small">Belum ada komentar.</div>'}`}
async function addComment(e,id){e.preventDefault();let f=e.target;let r=await sb.from('comments').insert({product_id:id,name:f.name.value.trim(),comment:f.comment.value.trim()});if(r.error)return alert(r.error.message);comments(id)}
async function adminList(){let el=document.getElementById('adminProducts');if(!el)return;let ps=await products();el.innerHTML=ps.length?ps.map(p=>card(p).replace('</article>',`<div class="actions"><button class="btn danger" onclick="del(${p.id})">🗑 Hapus</button></div></article>`)).join(''):'<div class="empty">Belum ada produk.</div>'}
async function del(id){if(!confirm('Hapus produk ini?'))return;let r=await sb.from('products').delete().eq('id',id);if(r.error)alert(r.error.message);else adminList()}
function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));document.getElementById('content').innerHTML=pages[p]||pages.home;if(['tools','store','free','paid'].includes(p))list(p,p);if(p==='admin'){document.getElementById('form').onsubmit=async e=>{e.preventDefault();let f=e.target;let r=await sb.from('products').insert({name:f.name.value,category:f.category.value,price:f.price.value?Number(f.price.value):null,thumbnail_url:f.thumbnail_url.value||null,download_url:f.download_url.value||null,ticket_url:f.ticket_url.value||null,description:f.description.value||null});document.getElementById('msg').textContent=r.error?'Gagal: '+r.error.message:'Produk berhasil ditambahkan!';if(!r.error){f.reset();f.ticket_url.value=DISCORD_TICKET_URL;adminList()}};adminList()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
const intro=document.getElementById('intro'),video=document.getElementById('video'),start=document.getElementById('start'),title=document.getElementById('title');
function finish(){start.classList.add('hidden');title.style.opacity=1;title.style.transform='scale(1)';setTimeout(()=>{intro.classList.add('open');setTimeout(()=>{intro.remove();document.getElementById('app').classList.remove('hidden');go('home')},1100)},900)}
video.onended=finish;start.onclick=async()=>{start.classList.add('hidden');try{await video.play()}catch(e){}};video.play().then(()=>start.classList.add('hidden')).catch(()=>{});
</script>
</body></html>
